# Newsletter Configuration

newsletter:
  name: "Salesforce AAA UVCE Weekly Digest"
  organization: "Salesforce AAA UVCE"
  tagline: "Your weekly dose of Salesforce & AI updates"
  
  # Maximum articles per section - the number of stories shown under each
  # section heading. Bump this up to include more news per category.
  max_articles_per_section: 5
  
  # LLM settings
  llm:
    backend: "groq"
    model: "openai/gpt-oss-120b"
    host: "http://localhost:11434"
    temperature: 0.7
    max_tokens: 4096
  
  # Output settings - the site always publishes a single public/index.html
  output:
    directory: "public"
    format: ["html"]
  
  # Distribution settings
  distribution:
    email:
      enabled: false
      smtp_host: "smtp.gmail.com"
      smtp_port: 587
      sender_email: ""
      recipients: []
    
    slack:
      enabled: false
      webhook_url: ""
      channel: "#newsletter"
